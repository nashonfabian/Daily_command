name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          flutter build apk --debug --verbose > build-output.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            tail -n 120 build-output.log
            {
              echo '### Android build failure (last 120 log lines)'
              echo '```text'
              tail -n 120 build-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-command-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-output.log
          if-no-files-found: ignore
