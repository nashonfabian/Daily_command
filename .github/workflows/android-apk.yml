name: Android debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK components
        shell: bash
        run: |
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$sdk_root" ]; then
            echo "The GitHub runner did not set ANDROID_HOME or ANDROID_SDK_ROOT." >&2
            exit 1
          fi
          sdkmanager="$sdk_root/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$sdkmanager" ]; then
            echo "Android SDK Manager was not found at $sdkmanager." >&2
            exit 1
          fi
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$sdkmanager" --sdk_root="$sdk_root" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Build debug APK
        shell: bash
        run: |
          set +e
          flutter build apk --debug --verbose > build-output.log 2>&1
          result=$?
          if [ "$result" -ne 0 ]; then
            diagnostics="$(grep -n -A 35 -B 3 -E 'What went wrong:|Execution failed for task|A problem occurred|Could not resolve|Could not find|requires .*compileSdk|^FAILURE:|error:' build-output.log | tail -n 160 || true)"
            if [ -z "$diagnostics" ]; then
              diagnostics="$(tail -n 120 build-output.log)"
            fi
            printf '%s\n' "$diagnostics"
            {
              echo '### Android build failure details'
              echo '```text'
              printf '%s\n' "$diagnostics"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$result"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: daily-command-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

      - name: Upload Android build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-build-log
          path: build-output.log
          if-no-files-found: ignore
